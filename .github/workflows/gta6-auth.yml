name: GTA 6 bot - connect YouTube
on:
  push:
    paths: ["gta6-bot/auth/code.enc"]
permissions: { contents: write }
jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - env: { BOT_KEY: "${{ secrets.BOT_KEY }}" }
        run: |
          if [ -z "$BOT_KEY" ]; then echo "FAILED - BOT_KEY secret missing" > gta6-bot/auth/status.txt; rm -f gta6-bot/auth/code.enc; else python gta6-bot/auth.py; fi
      - run: |
          git config user.name "gta6-bot" && git config user.email "bot@users.noreply.github.com"
          git add -A gta6-bot && git commit -m "GTA 6 bot: YouTube connection result" && git pull --rebase -q && git push
