name: Free lip-sync on Kaggle GPU
on:
  push:
    paths: ["lipsync/jobs/**"]
  workflow_dispatch:
concurrency: { group: lipsync, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q "kaggle>=1.7"
      - name: Kaggle credentials
        env: { BOT_KEY: "${{ secrets.BOT_KEY }}" }
        run: |
          T=$(openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -base64 -A -pass env:BOT_KEY -in gta6-bot/secrets.enc | python -c "import json,sys;print(json.load(sys.stdin)['kaggle_token'])")
          echo "::add-mask::$T"
          echo "KAGGLE_API_TOKEN=$T" >> "$GITHUB_ENV"
      - name: Run pending jobs
        env: { KAGGLE_USERNAME: "${{ secrets.KAGGLE_USERNAME }}" }
        run: python lipsync/submit.py
      - name: Save results
        if: always()
        run: |
          git config user.name "lipsync-bot" && git config user.email "bot@users.noreply.github.com"
          git add lipsync/jobs
          git diff --cached --quiet || (git commit -m "lipsync: results" && git pull --rebase -q && git push)
