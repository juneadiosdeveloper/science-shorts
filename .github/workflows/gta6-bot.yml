name: GTA 6 Moments bot
on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch:
  push:
    paths: ["gta6-bot/run-now.txt"]
concurrency: { group: gta6-bot, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: gta6-bot/requirements.txt }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -q -r gta6-bot/requirements.txt
      - name: Post one Short
        if: hashFiles('gta6-bot/state/yt_token.enc') != ''
        env: { BOT_KEY: "${{ secrets.BOT_KEY }}" }
        run: |
          set -o pipefail
          python gta6-bot/bot.py 2>&1 | tail -40 | tee gta6-bot/state/last_run.txt
      - name: Save state
        if: always()
        run: |
          git config user.name "gta6-bot" && git config user.email "bot@users.noreply.github.com"
          git add gta6-bot/state
          git diff --cached --quiet || (git commit -m "GTA 6 bot: posted a Short" && git pull --rebase -q && git push)
