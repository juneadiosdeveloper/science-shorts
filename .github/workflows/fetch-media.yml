name: fetch-media
on:
  push:
    paths: ["fetch/list.txt"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download listed files
        run: |
          mkdir -p fetched
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -fsSL -o "fetched/$name" "$url"
          done < fetch/list.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add fetched
          git commit -m "Fetch media files [skip ci]" || echo "nothing new"
          git push
