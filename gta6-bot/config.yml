# GTA 6 Moments bot settings
twitch_game_names: ["Grand Theft Auto VI", "Grand Theft Auto 6"]
clip_max_age_hours: 48        # only fresh clips
min_clip_views: 300           # skip clips nobody watched
min_clip_seconds: 12
languages: ["en", "hi"]       # English + Hindi streams
max_per_day: 5                # YouTube API quota allows ~6 uploads/day
max_per_streamer_per_day: 2   # keep the channel varied
hook_max_chars: 48
captions: true
whisper_model: base
# Google keeps uploads private until the app passes its free audit.
# Switch to "public" once approved.
privacy: private
# Before going public: list only streamers who allow clipping, then set
# require_allowlist: true. Streamers in blocklist are never used.
require_allowlist: false
allowlist: []
blocklist: []
tags: ["GTA 6", "GTA VI", "Grand Theft Auto 6", "GTA 6 gameplay", "GTA 6 funny moments", "Vice City", "Leonida", "shorts", "gaming"]
title_blocklist: []   # owner choice: no content filter
